# Bandit is a tool designed to find common security issues in Python code
# this is a customized copy from https://github.com/PyCQA/bandit-action
# original author: '@PyCQA'
#
# Target for code check is src/moin, test modules are exclude in config file
# All alerts are logged in the GitHub UI on the Security tab, Code Scanning (choose your branch)

name: Bandit

on:
  push:
    branches:
      - master
      - test-github-action
  pull_request:
    branches:
      - master

permissions:
  contents: read
  security-events: write

jobs:
  bandit_check:

    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install Bandit
        shell: bash
        run: pip install bandit[sarif]

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Bandit
        shell: bash
        run: bandit -c pyproject.toml -r src/moin -f sarif -o results.sarif || true

      - name: Prioritise Bandit findings with Lumi Trace (optional)
        id: lumi
        continue-on-error: true
        uses: noqt/Lumi-Trace@efacb5784604ed98bf608732832db938eefbd295 # v0.10.0
        with:
          sarif: results.sarif

      - name: Report Bandit and Lumi diagnostic counts
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json

          with open("results.sarif", encoding="utf-8") as stream:
              report = json.load(stream)
          count = sum(len(run.get("results", [])) for run in report.get("runs", []))
          print(f"Bandit SARIF results: {count}")
          PY
          echo "Lumi status: ${{ steps.lumi.outputs.status }}"
          echo "Lumi exit code: ${{ steps.lumi.outputs.exit-code }}"
          echo "Lumi package ready: ${{ steps.lumi.outputs.package-ready }}"

      - name: Upload SARIF file
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
